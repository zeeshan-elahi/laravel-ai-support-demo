# Fixed project name, so container and network names don't depend on the folder name.
name: laravel-ai-support-demo

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rag}
      POSTGRES_USER: ${DB_USERNAME:-rag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rag} -d ${DB_DATABASE:-rag}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    # Pinned to the volume created under the repo's first name, so the database survives the rename.
    name: laravel-rag-demo_pgdata
